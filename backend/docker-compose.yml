services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: affetta
      POSTGRES_USER: affetta
      POSTGRES_PASSWORD: change-me-postgres
    volumes:
      - affetta-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U affetta -d affetta"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8.8.1-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - affetta-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: affetta-minio
      MINIO_ROOT_PASSWORD: change-me-minio-secret
    volumes:
      - affetta-minio:/data
    ports:
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 affetta-minio change-me-minio-secret &&
      mc mb --ignore-existing local/affetta-artifacts;
      "

  backend-migrate:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    command: ["node", "dist/src/migrate.js"]

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      backend-migrate:
        condition: service_completed_successfully
    ports:
      - "8790:8790"
    restart: unless-stopped

volumes:
  affetta-postgres:
  affetta-redis:
  affetta-minio:
